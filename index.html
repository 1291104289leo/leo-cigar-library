<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leo Cigar Library</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#15120f;color:#f4eadb}
main{max-width:900px;margin:auto;padding:72px 24px}
.badge{display:inline-block;padding:7px 12px;border:1px solid #a66a2c;border-radius:999px;color:#d8a35d}
h1{font-size:clamp(42px,8vw,78px);line-height:.95;margin:24px 0}
p{max-width:650px;color:#c9b9a6;font-size:18px;line-height:1.7}
.card{margin-top:44px;padding:28px;border:1px solid #403329;border-radius:20px;background:#1e1915}
</style>
</head>
<body>
<main>
<span class="badge">LEO'S COLLECTION</span>
<h1>Leo Cigar<br>Library</h1>
<p>一个用于记录、整理和探索个人雪茄收藏的数字资料库。未来这里会记录库存、风味、购买与到货时间、养护状态以及个人品吸笔记。</p>
<div class="card">
<h2>🥃 Library is growing.</h2>
<p>这是项目的第一个版本。下一步：加入雪茄库存卡片、搜索筛选、养护天数和可视化统计。</p>
</div>
</main>
</body>
</html>
